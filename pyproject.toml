[project]
name = "delta-chat"
version = "0.1.0"
description = "Document delta & grounded chat over PID revisions"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.83",
  "google-genai>=1.6",
  "openai>=1.0",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "ezdxf>=1.3",
  "pillow>=10.0",
  "chromadb>=1.5",
  "tiktoken>=0.12",
  "numpy>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
